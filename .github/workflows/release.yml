name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-beta.1" >&2
            exit 1
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Extract changelog notes
        shell: python
        run: |
          import os
          import re
          import sys
          from pathlib import Path

          version = "${{ steps.release.outputs.version }}"
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^## \[{re.escape(version)}\](?:\s+-\s+.+)?\s*$", re.MULTILINE)
          match = heading.search(changelog)

          if not match:
              sys.stderr.write(f"CHANGELOG.md does not contain a section for [{version}].\n")
              sys.exit(1)

          next_heading = re.search(r"^## \[", changelog[match.end():], re.MULTILINE)
          end = match.end() + next_heading.start() if next_heading else len(changelog)
          notes = changelog[match.end():end].strip()

          if not notes:
              sys.stderr.write(f"CHANGELOG.md section [{version}] is empty.\n")
              sys.exit(1)

          Path("release-notes.md").write_text(notes + os.linesep, encoding="utf-8")

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "19"
          cache: maven

      - name: Build and test
        run: ./mvnw -B test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            --verify-tag \
            --title "LMSdesktop ${{ steps.release.outputs.version }}" \
            --notes-file release-notes.md
